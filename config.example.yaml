# Copy to config.yaml and fill in. Values like ${RESY_AUTH_TOKEN} are read
# from the environment or a local .env file (see .env.example).
#
# The `watches:` section below is Peter's real target list. Each restaurant
# still needs its numeric Resy venue_id — look it up once with:
#   python -m resywatch search "4 Charles Prime Rib"
# and paste the number into venue_id. Run `python -m resywatch watches` to see
# which ones still say NEEDS ID.

resy:
  api_key: "VbWk7s3L4KiK5fzlO7JD3Q5EYolJI7n5"

  # EITHER paste an auth token from resy.com (DevTools -> Network -> any
  # api.resy.com request -> "x-resy-auth-token" header) ...
  auth_token: "${RESY_AUTH_TOKEN}"
  # ... OR log in with email + password (leave auth_token blank).
  email: "${RESY_EMAIL}"
  password: "${RESY_PASSWORD}"

  # Optional; most hard-to-get venues require a card on file. Blank = Resy default.
  payment_method_id: "${RESY_PAYMENT_METHOD_ID}"

server:
  host: "127.0.0.1"
  port: 8787
  public_url: "http://127.0.0.1:8787"

poll:
  interval_seconds: 60      # pause between full sweeps of the whole list
  jitter_seconds: 15        # random extra delay so requests aren't robotic
  lookahead_days: 30        # never look further out than this many days
  per_request_delay: 0.7    # polite pause between individual Resy calls

notifications:
  console: true
  ntfy:
    enabled: false
    server: "https://ntfy.sh"
    topic: "resywatch-CHANGE-ME-to-something-unguessable"
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    username: "${SMTP_USER}"
    password: "${SMTP_PASS}"
    from_addr: "${SMTP_USER}"
    to_addr: "peter.federer@gmail.com"

# Shared parameters: party size 2 or 4, Thu/Fri/Sat, 5:30pm onward.
